[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eraga"
version = "0.1.0"
description = "Enterprise RAG Assistant — permission-aware Retrieval-Augmented Generation platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3.6",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
ingest = [
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "langchain-text-splitters>=0.2",
]
retrieval = [
    "rank-bm25>=0.2.2",
]
queue = ["celery>=5.4", "redis>=5.0"]
security = ["python-jose[cryptography]>=3.3", "passlib[bcrypt]>=1.7"]
eval = ["ragas>=0.1"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
all = [
    "eraga[ingest,retrieval,queue,security,eval,dev]",
]

[tool.setuptools.packages.find]
include = ["app*", "workers*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole session. Without this, pytest-asyncio gives fixtures
# and tests different loops and SQLAlchemy's asyncpg pool breaks with
# "Event loop is closed" when a pooled connection is reused across loops.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs", "data", ".venv", "alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI requires `Depends(...)` as a default argument; B008 would otherwise flag it.
"app/api/routes/*.py" = ["B008"]
"tests/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true